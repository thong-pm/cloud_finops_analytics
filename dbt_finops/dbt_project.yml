name: 'dbt_finops'
version: '1.0.0'
config-version: 2

profile: 'dbt_finops'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_finops:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  dbt_finops:
    seed_synthetic_segment_revenue:
      +column_types:
        sub_account_id: "{{ 'string' if target.type == 'bigquery' else 'varchar(64)' }}"

vars:
  sp_floor_percentile: 0.10

